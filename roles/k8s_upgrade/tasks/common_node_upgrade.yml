---
- name: Drain the node
  ansible.builtin.shell: >
    kubectl drain {{ inventory_hostname }} 
    --ignore-daemonsets 
    --delete-emptydir-data 
  delegate_to: "{{ groups['masters'][0] }}"
  register: drain_cmd
  until: drain_cmd.rc == 0
  retries: 5
  delay: 15
  when: need_pkg_update

- name: Unhold packages before upgrade
  ansible.builtin.include_tasks: unhold_packages.yml
  when: need_pkg_update

- name: Install kubeadm and cri-o (Debian)
  ansible.builtin.apt:
    name:
      - "{{ kubeadm_pkg }}"
      - "{{ crio_pkg }}"
    state: present
    update_cache: yes
  when:
    - need_pkg_update
    - ansible_os_family == 'Debian'

- name: Update kubeadm and cri-o (RedHat)
  ansible.builtin.dnf:
    name:
      - "{{ kubeadm_pkg }}"
      - "{{ crio_pkg }}"
    state: present
    enablerepo: "kubernetes,cri-o"
    disable_excludes: main
  when:
    - need_pkg_update
    - ansible_os_family == 'RedHat'

- name: Restart cri-o if updated
  ansible.builtin.systemd:
    name: cri-o
    state: restarted
    daemon_reload: yes
  when: crio_ver_current != crio_target

- name: Run kubeadm upgrade node
  ansible.builtin.command: kubeadm upgrade node
  when: need_pkg_update

- name: Upgrade kubelet and kubectl (Debian)
  ansible.builtin.apt:
    name:
      - "{{ kubelet_pkg }}"
      - "{{ kubectl_pkg }}"
    state: present
  when:
    - need_pkg_update
    - ansible_os_family == 'Debian'

- name: Upgrade kubelet and kubectl (RedHat)
  ansible.builtin.dnf:
    name:
      - "{{ kubelet_pkg }}"
      - "{{ kubectl_pkg }}"
    state: present
    enablerepo: "kubernetes,cri-o"
    disable_excludes: main
  when:
    - need_pkg_update
    - ansible_os_family == 'RedHat'

- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: yes
  when: need_pkg_update

- name: Hold packages after upgrade
  ansible.builtin.include_tasks: hold_packages.yml
  when: need_pkg_update

- name: Reboot the node for a clean state
  ansible.builtin.reboot:
    reboot_timeout: 600
    post_reboot_delay: 30
  when: need_pkg_update

- name: Uncordon the node
  ansible.builtin.shell: kubectl uncordon {{ inventory_hostname }}
  delegate_to: "{{ groups['masters'][0] }}"
  register: uncordon_cmd
  until: uncordon_cmd.rc == 0
  retries: 5
  delay: 10
  when: need_pkg_update

- name: Wait for administrator confirmation to proceed
  ansible.builtin.pause:
    prompt: "\n======================================================\nNode {{ inventory_hostname }} has been fully upgraded, rebooted, and uncordoned.\nPlease verify its state.\nPress ENTER or type 'yes' to continue to the next node.\n======================================================"
  when: need_pkg_update