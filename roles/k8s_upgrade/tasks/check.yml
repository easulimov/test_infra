---
- name: Ensure dnf versionlock plugin is available
  ansible.builtin.dnf:
    name: "dnf-command(versionlock)"
    state: present

- name: Get current kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_ver_out
  ignore_errors: yes

- name: Get current kubectl version (JSON)
  ansible.builtin.command: kubectl version --client -o json
  register: kubectl_ver_out
  ignore_errors: yes

- name: Get current kubelet version
  ansible.builtin.command: kubelet --version
  register: kubelet_ver_out

- name: Get current cri-o version
  ansible.builtin.command: crio --version
  register: crio_ver_out
  ignore_errors: yes

- name: Extract clean versions
  ansible.builtin.set_fact:
    kubeadm_installed: "{{ kubeadm_ver_out.stdout | trim }}"
    kubectl_installed: >-
      {{ (kubectl_ver_out.stdout | from_json).clientVersion.gitVersion
         if kubectl_ver_out.stdout | default('') != ''
         else '' }}
    kubelet_installed: "{{ kubelet_ver_out.stdout | regex_replace('Kubernetes ', '') | trim }}"
    crio_installed: "{{ crio_ver_out.stdout | regex_replace('crio version ', '') | trim }}"

- name: Set target versions from extra vars
  ansible.builtin.set_fact:
    kubeadm_target: "v{{ k8s_ver }}"
    kubectl_target: "v{{ k8s_ver }}"
    kubelet_target: "v{{ k8s_ver }}"
    crio_target: "{{ crio_ver }}"

- name: Determine if any package needs update
  ansible.builtin.set_fact:
    need_pkg_update: >-
      {{ (kubeadm_installed != kubeadm_target) or
         (kubectl_installed != kubectl_target) or
         (kubelet_installed != kubelet_target) or
         (crio_installed != crio_target) }}

- name: Set repo minor versions for templates
  ansible.builtin.set_fact:
    k8s_repo_minor: "v{{ k8s_ver | regex_replace('^([0-9]+\\.[0-9]+).*', '\\1') }}"
    crio_repo_minor: "v{{ crio_ver | regex_replace('^([0-9]+\\.[0-9]+).*', '\\1') }}"

- name: Print current vs target versions
  ansible.builtin.debug:
    msg:
      - "Current versions: kubeadm={{ kubeadm_installed }}, kubectl={{ kubectl_installed }}, kubelet={{ kubelet_installed }}, cri-o={{ crio_installed }}"
      - "Target versions: kubeadm={{ kubeadm_target }}, kubectl={{ kubectl_target }}, kubelet={{ kubelet_target }}, cri-o={{ crio_target }}"
      - "Need update: {{ need_pkg_update }}"
