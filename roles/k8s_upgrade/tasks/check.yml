---
- name: Ensure dnf versionlock plugin is available
  ansible.builtin.dnf:
    name: "dnf-command(versionlock)"
    state: present
  when: ansible_os_family == 'RedHat'

- name: Get current kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_ver_out
  ignore_errors: yes

- name: Get current kubectl version
  ansible.builtin.command: kubectl version --client -o short
  register: kubectl_ver_out
  ignore_errors: yes

- name: Get current kubelet version
  ansible.builtin.command: kubelet --version
  register: kubelet_ver_out

- name: Get current cri-o version
  ansible.builtin.command: crio --version
  register: crio_ver_out
  ignore_errors: yes

- name: Extract clean versions
  ansible.builtin.set_fact:
    kubeadm_ver: "{{ kubeadm_ver_out.stdout | trim }}"
    kubectl_ver: "{{ kubectl_ver_out.stdout | regex_replace('Client Version: ', '') | trim }}"
    kubelet_ver: "{{ kubelet_ver_out.stdout | regex_replace('Kubernetes ', '') | trim }}"
    crio_ver_current: "{{ crio_ver_out.stdout | regex_replace('crio version ', '') | trim }}"

- name: Define target versions
  ansible.builtin.set_fact:
    kubeadm_target: "v{{ k8s_ver }}"
    kubectl_target: "v{{ k8s_ver }}"
    kubelet_target: "v{{ k8s_ver }}"
    crio_target: "{{ crio_ver }}"

- name: Determine if any package needs update
  ansible.builtin.set_fact:
    need_pkg_update: >-
      {{ (kubeadm_ver != kubeadm_target) or
         (kubectl_ver != kubectl_target) or
         (kubelet_ver != kubelet_target) or
         (crio_ver_current != crio_target) }}

- name: Set OS family and repo minor versions
  ansible.builtin.set_fact:
    os_family: "{{ ansible_os_family }}"
    k8s_repo_minor: "v{{ k8s_ver | regex_replace('^([0-9]+\\.[0-9]+).*', '\\1') }}"
    crio_repo_minor: "v{{ crio_ver | regex_replace('^([0-9]+\\.[0-9]+).*', '\\1') }}"

- name: Set package versions for installation
  ansible.builtin.set_fact:
    kubeadm_pkg: "kubeadm{% if ansible_os_family == 'Debian' %}={{ k8s_ver }}-00{% else %}-{{ k8s_ver }}{% endif %}"
    kubectl_pkg: "kubectl{% if ansible_os_family == 'Debian' %}={{ k8s_ver }}-00{% else %}-{{ k8s_ver }}{% endif %}"
    kubelet_pkg: "kubelet{% if ansible_os_family == 'Debian' %}={{ k8s_ver }}-00{% else %}-{{ k8s_ver }}{% endif %}"
    crio_pkg: "cri-o{% if ansible_os_family == 'Debian' %}={{ crio_ver }}-00{% else %}-{{ crio_ver }}{% endif %}"

- name: Print resolved package names and versions for verification
  ansible.builtin.debug:
    msg:
      - "OS Family: {{ os_family }}"
      - "k8s_ver (input): {{ k8s_ver }}"
      - "crio_ver (input): {{ crio_ver }}"
      - "k8s_repo_minor: {{ k8s_repo_minor }}"
      - "crio_repo_minor: {{ crio_repo_minor }}"
      - "kubeadm_pkg: {{ kubeadm_pkg }}"
      - "kubectl_pkg: {{ kubectl_pkg }}"
      - "kubelet_pkg: {{ kubelet_pkg }}"
      - "crio_pkg: {{ crio_pkg }}"
      - "need_pkg_update: {{ need_pkg_update }}"
