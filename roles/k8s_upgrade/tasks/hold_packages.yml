---
- name: Hold packages (Debian)
  ansible.builtin.command: apt-mark hold kubeadm kubelet kubectl cri-o
  when: ansible_os_family == 'Debian'

- name: Hold packages (RedHat) - add versionlock
  ansible.builtin.command: dnf versionlock add kubeadm kubelet kubectl cri-o
  when: ansible_os_family == 'RedHat'
