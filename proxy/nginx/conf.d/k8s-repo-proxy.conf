server {
    listen 80;
    server_name repo.seaspace.name;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host:48443$request_uri;
    }
}

server {
    listen 48443 ssl http2;
    server_name repo.seaspace.name;

    # Отключаем IPv6, чтобы избежать таймаутов на Network is unreachable
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    ssl_certificate /etc/letsencrypt/live/repo.seaspace.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repo.seaspace.name/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Большие буферы для XML метаданных DNF
    proxy_buffer_size 256k;
    proxy_buffers 4 512k;
    proxy_busy_buffers_size 512k;

    # ===== Проксирование на Kubernetes (Исправлен домен pkgs.k8s.io) =====
    location / {
        set $upstream_endpoint https://pkgs.k8s.io;
        proxy_pass $upstream_endpoint$request_uri;

        proxy_set_header Host pkgs.k8s.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name pkgs.k8s.io;

        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 301 302 307 = @handle_redirect;
    }

    # ===== Проксирование на CRI-O (Исправлен домен download.opensuse.org) =====
    location /repositories/isv:/cri-o:/ {
        # КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: Добавлен поддомен download.
        proxy_pass https://download.opensuse.org;

        proxy_set_header Host download.opensuse.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключаем верификацию CDN openSUSE
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name download.opensuse.org;

        # Принудительно перехватываем 301, 302 и 307 ответы балансировщика
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 301 302 307 = @handle_redirect;
    }

    # ===== Единственный и универсальный обработчик редиректов =====
    location @handle_redirect {
        set $saved_redirect_url $upstream_http_location;
        set $redirect_host "";

        # Извлекаем домен зеркала из полученного URL
        if ($saved_redirect_url ~* "^https?://([^/:]+)") {
            set $redirect_host $1;
        }

        # Подменяем заголовок Host на домен конечного зеркала
        proxy_set_header Host $redirect_host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";

        # Отключаем верификацию SSL для зеркал, так как их сотни
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $redirect_host;

        # Прокси сервер сам идет по ссылке редиректа и забирает файл
        proxy_pass $saved_redirect_url;
    }
}
