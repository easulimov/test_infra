server {
    listen 80;
    server_name docker.seaspace.name;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
    # Перенаправляем на ваш кастомный порт 48443, как в примере с k8s
    location / { return 301 https://$host:48443$request_uri; }
}

server {
    listen 48443 ssl http2;
    server_name docker.seaspace.name;

    # 1. Резолвер (используем ваши настройки)
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Пути к сертификатам для нового домена
    ssl_certificate     /etc/letsencrypt/live/docker.seaspace.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docker.seaspace.name/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Настройки для больших слоев Docker (важно!)
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 900;

    # Буферы для заголовков (у Docker они бывают длинными из-за токенов)
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # 2. Включаем перехват редиректов (ваша рабочая схема)
    proxy_intercept_errors on;
    recursive_error_pages on;

    # Основной блок для работы с Docker Hub API
    location / {
        set $upstream_endpoint https://registry-1.docker.io;
        proxy_pass $upstream_endpoint$request_uri;

        proxy_set_header Host registry-1.docker.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Передаем заголовки авторизации (важно для получения токенов)
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;

        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name registry-1.docker.io;

        # Обработка 301/302/307 (когда Docker Hub отправляет за слоями на S3)
        error_page 301 302 307 = @handle_redirect;
    }

    # Специальный блок для авторизации (иногда запросы идут на auth.docker.io)
    location /v2/auth {
        set $upstream_auth https://auth.docker.io;
        proxy_pass $upstream_auth$request_uri;

        proxy_set_header Host auth.docker.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name auth.docker.io;
    }

    # Ваша проверенная логика обработки редиректов
    location @handle_redirect {
        set $saved_redirect_url $upstream_http_location;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";

        # Очищаем авторизацию при переходе на S3/CloudFront, чтобы не было ошибок 403
        proxy_set_header Authorization "";

        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_name $proxy_host;

        proxy_pass $saved_redirect_url;
    }
}
