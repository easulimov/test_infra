[defaults]
# Инвентарь (можно указать относительный путь)
inventory = hosts/inventory.yaml

# Где хранятся роли (по умолчанию roles, но можно явно указать)
roles_path = roles

# Отключить проверку хостов SSH (для тестовых сред, в проде лучше использовать known_hosts)
host_key_checking = False

# Включить pipelining для ускорения (требует настройки sudo без tty)
# pipelining = True

# Таймауты для SSH
timeout = 30

# Включить вывод цветов в консоль
force_color = 1

# Логирование
log_path = /var/log/ansible/ansible.log

# При запуске ansible-playbook выводить время выполнения каждого таска
display_args_to_stdout = True

# Количество параллельных процессов (по умолчанию 5, можно увеличить)
forks = 10

# Стратегия выполнения: линейная (по умолчанию) или free
strategy = linear

# Отключить сбор фактов, если не нужны (но мы будем использовать)
gathering = smart

# Использовать факты в кэше (для ускорения)
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 86400

# Обработка ошибок: продолжать выполнение на остальных хостах при ошибке
any_errors_fatal = False

[ssh_connection]
# Использовать ControlMaster для ускорения повторных подключений
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
control_master = auto
control_persist = 60s

# Сжатие SSH (может ускорить при медленных каналах)
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s

# Таймауты соединения
connect_timeout = 30